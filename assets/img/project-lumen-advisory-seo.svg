<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Lumen Advisory SEO plan preview">
  <defs>
    <linearGradient id="la-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbf9"/>
      <stop offset="1" stop-color="#eceef1"/>
    </linearGradient>
    <linearGradient id="la-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="la-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#5b9bff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#la-bg)"/>
  <rect x="0" y="0" width="640" height="54" fill="#ffffff"/>
  <rect x="0" y="53" width="640" height="1" fill="#e2e5ea"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="34" y="22" width="16" height="16" rx="4" fill="url(#la-ink)"/>
    <text x="58" y="35" font-size="10.5" font-weight="bold" fill="#1f2937" letter-spacing="2">LUMEN ADVISORY</text>
    <g fill="#8b94a3" font-size="7" letter-spacing="1.3">
      <text x="368" y="34">SERVICES</text>
      <text x="428" y="34">INSIGHTS</text>
      <text x="488" y="34">ABOUT</text>
    </g>
    <rect x="546" y="21" width="60" height="20" rx="3" fill="none" stroke="#c9cfd8"/>
    <text x="576" y="34" font-size="6.5" fill="#4b5563" text-anchor="middle" letter-spacing="1">CONTACT</text>

    <text x="34" y="92" font-size="7" fill="#2f6feb" letter-spacing="2.6">CONTENT &amp; TECHNICAL SEO</text>
    <text x="34" y="128" font-size="24" font-weight="bold" fill="#111827" letter-spacing="-0.5">Dense copy, made</text>
    <text x="34" y="156" font-size="24" font-weight="bold" fill="#111827" letter-spacing="-0.5">findable and readable.</text>
    <text x="34" y="180" font-size="8.5" fill="#6b7280">Service pages restructured around intent, with a clear next step on</text>
    <text x="34" y="193" font-size="8.5" fill="#6b7280">every template.</text>
  </g>

  <!-- ranking chart -->
  <g>
    <rect x="34" y="212" width="300" height="112" rx="6" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="48" y="232" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#8b94a3" letter-spacing="1.4">IMPRESSIONS · 90 DAYS</text>
    <g stroke="#eef0f4" stroke-width="1">
      <path d="M48 280h268M48 258h268M48 302h268"/>
    </g>
    <path d="M48 306l42-8 44 4 46-18 44-14 46-22 46-14"
          fill="none" stroke="url(#la-accent)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M48 306l42-8 44 4 46-18 44-14 46-22 46-14v52H48z" fill="#2f6feb" opacity="0.07"/>
    <circle cx="316" cy="234" r="3.6" fill="#2f6feb"/>
    <text x="48" y="318" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#9aa3b0">Wk 1</text>
    <text x="292" y="318" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#9aa3b0">Wk 12</text>
  </g>

  <!-- page outline -->
  <g>
    <rect x="350" y="92" width="256" height="232" rx="6" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="366" y="114" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#8b94a3" letter-spacing="1.4">NEW PAGE STRUCTURE</text>

    <g font-family="Helvetica, Arial, sans-serif">
      <rect x="366" y="126" width="224" height="26" rx="3" fill="#f4f6fa"/>
      <text x="376" y="143" font-size="8" fill="#111827" font-weight="bold">H1 · Retirement planning</text>

      <rect x="366" y="158" width="224" height="20" rx="3" fill="#fbfcfe" stroke="#eef0f4"/>
      <text x="376" y="172" font-size="7" fill="#4b5563">H2 · How much will you need?</text>
      <rect x="366" y="182" width="224" height="20" rx="3" fill="#fbfcfe" stroke="#eef0f4"/>
      <text x="376" y="196" font-size="7" fill="#4b5563">H2 · Tax-efficient drawdown</text>
      <rect x="366" y="206" width="224" height="20" rx="3" fill="#fbfcfe" stroke="#eef0f4"/>
      <text x="376" y="220" font-size="7" fill="#4b5563">H2 · Planning checklist</text>

      <rect x="366" y="234" width="224" height="34" rx="3" fill="#eef4ff"/>
      <text x="376" y="248" font-size="6.5" fill="#2f6feb" letter-spacing="1">FAQ SCHEMA · 6 QUESTIONS</text>
      <text x="376" y="260" font-size="6.5" fill="#6b81a8">Answers written for featured snippets</text>

      <rect x="366" y="276" width="224" height="34" rx="3" fill="#f4f6fa"/>
      <text x="376" y="290" font-size="6.5" fill="#4b5563" letter-spacing="1">CTA · BOOK A CONSULTATION</text>
      <text x="376" y="302" font-size="6.5" fill="#8b94a3">One primary action per template</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="34" y="344" width="572" height="1" fill="#e2e5ea"/>
    <text x="34" y="368" font-size="7" fill="#8b94a3" letter-spacing="1.6">TECHNICAL SEO · CONTENT STRUCTURE · CORE WEB VITALS</text>
  </g>
</svg>
