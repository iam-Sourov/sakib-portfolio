<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Aster Dental Clinic website preview">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2faf8"/>
      <stop offset="1" stop-color="#dcefea"/>
    </linearGradient>
    <linearGradient id="ad-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8a7d"/>
      <stop offset="1" stop-color="#2aa89a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ad-bg)"/>
  <circle cx="548" cy="86" r="104" fill="#c9e8e1" opacity="0.6"/>
  <circle cx="70" cy="360" r="86" fill="#e3f2ff" opacity="0.7"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="34" y="26" width="18" height="18" rx="5" fill="url(#ad-teal)"/>
    <text x="60" y="40" font-size="12" font-weight="bold" fill="#12403b" letter-spacing="1.2">ASTER DENTAL</text>
    <g fill="#5f7b76" font-size="8" letter-spacing="1">
      <text x="382" y="39">TREATMENTS</text>
      <text x="450" y="39">TEAM</text>
      <text x="495" y="39">CONTACT</text>
    </g>
    <rect x="540" y="25" width="66" height="21" rx="10.5" fill="url(#ad-teal)"/>
    <text x="573" y="39" font-size="7.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">BOOK NOW</text>

    <text x="34" y="106" font-size="8" fill="#3e9b8f" letter-spacing="2.4">FAMILY DENTISTRY</text>
    <text x="34" y="146" font-size="30" font-weight="bold" fill="#123b37" letter-spacing="-0.8">Gentle dentistry,</text>
    <text x="34" y="180" font-size="30" font-weight="bold" fill="#123b37" letter-spacing="-0.8">close to home.</text>
    <text x="34" y="206" font-size="9.5" fill="#5f7b76">Preventive care, cosmetic treatment and emergency visits for</text>
    <text x="34" y="220" font-size="9.5" fill="#5f7b76">the whole family, explained without the jargon.</text>

    <rect x="34" y="240" width="92" height="26" rx="6" fill="url(#ad-teal)"/>
    <text x="80" y="257" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="1">BOOK A VISIT</text>
    <rect x="134" y="240" width="92" height="26" rx="6" fill="none" stroke="#9dc9c1" stroke-width="1.2"/>
    <text x="180" y="257" font-size="8" fill="#356b64" text-anchor="middle" letter-spacing="1">TREATMENTS</text>

    <g font-size="8" fill="#356b64">
      <rect x="34" y="296" width="76" height="24" rx="12" fill="#ffffff" stroke="#c9e0db"/>
      <text x="72" y="311" text-anchor="middle">Check-ups</text>
      <rect x="118" y="296" width="66" height="24" rx="12" fill="#ffffff" stroke="#c9e0db"/>
      <text x="151" y="311" text-anchor="middle">Whitening</text>
      <rect x="192" y="296" width="60" height="24" rx="12" fill="#ffffff" stroke="#c9e0db"/>
      <text x="222" y="311" text-anchor="middle">Implants</text>
    </g>
  </g>

  <!-- appointment card -->
  <g>
    <rect x="420" y="118" width="186" height="196" rx="14" fill="#ffffff" stroke="#d4e8e3"/>
    <rect x="440" y="138" width="60" height="6" rx="3" fill="#dcefea"/>
    <text x="440" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#123b37">Your visit</text>
    <g stroke="#e4f0ed" stroke-width="1">
      <rect x="440" y="180" width="146" height="20" rx="5" fill="#f7fbfa"/>
      <rect x="440" y="208" width="146" height="20" rx="5" fill="#f7fbfa"/>
      <rect x="440" y="236" width="146" height="20" rx="5" fill="#f7fbfa"/>
    </g>
    <text x="450" y="194" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#8aa8a2">Full name</text>
    <text x="450" y="222" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#8aa8a2">Phone</text>
    <text x="450" y="250" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#8aa8a2">Preferred date</text>
    <rect x="440" y="266" width="146" height="26" rx="6" fill="url(#ad-teal)"/>
    <text x="513" y="283" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="1">REQUEST APPOINTMENT</text>
  </g>

  <!-- tooth mark -->
  <g transform="translate(524 246)" opacity="0.55">
    <path d="M0 0c-8-8-22-6-22 6 0 10 7 12 8 22 1 8 5 9 7 2 1-5 3-12 7-12s6 7 7 12c2 7 6 6 7-2 1-10 8-12 8-22 0-12-14-14-22-6Z" fill="none" stroke="#2aa89a" stroke-width="2"/>
  </g>
</svg>
