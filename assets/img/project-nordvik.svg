      <rect x="522" y="122" width="46" height="42" rx="6" fill="#46604d"/>
      <path d="M530 122c2-8 10-12 15-8s12 4 15 8" stroke="#8fd694" stroke-width="2" fill="none"/>
      <text x="500" y="222" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#dbe9e0">Trail 28L Pack</text>
      <text x="500" y="234" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#8fd694">$119</text>
