  <g font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#cfe0d6">
    <rect x="34" y="252" width="58" height="20" rx="10" fill="#1e3029" stroke="#37514a"/>
    <text x="63" y="265" text-anchor="middle">Insulated</text>
    <rect x="100" y="252" width="50" height="20" rx="10" fill="#1e3029" stroke="#37514a"/>
    <text x="125" y="265" text-anchor="middle">Shell</text>
    <rect x="158" y="252" width="46" height="20" rx="10" fill="#1e3029" stroke="#37514a"/>
    <text x="181" y="265" text-anchor="middle">Fleece</text>
    <text x="220" y="265" fill="#6f857c">12 items</text>
