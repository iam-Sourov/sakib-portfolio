  <g font-family="Helvetica, Arial, sans-serif">
    <text x="34" y="330" font-size="7" fill="#6f857c" letter-spacing="2">SIZE &amp; COLOUR VARIANTS · FREE RETURNS · 2-YEAR REPAIR</text>
    <rect x="34" y="344" width="572" height="1" fill="#2b3f37"/>
