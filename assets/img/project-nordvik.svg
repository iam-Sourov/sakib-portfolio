  </defs>
  <rect width="640" height="400" fill="url(#nv-bg)"/>
  <path d="M0 300l96-92 74 62 62-52 88 82 82-64 78 64 84-70 76 70v100H0z" fill="#16241f" opacity="0.9"/>
  <path d="M0 320l70-64 58 48 66-56 90 80H0z" fill="url(#nv-mount)" opacity="0.8"/>

  <g font-family="Helvetica, Arial, sans-serif">
