    <text x="34" y="96" font-size="7" fill="#8fd694" letter-spacing="2.6">WINTER ARRIVALS</text>
    <text x="34" y="134" font-size="28" font-weight="bold" fill="#f4faf5" letter-spacing="-0.6">Built for cold</text>
    <text x="34" y="166" font-size="28" font-weight="bold" fill="#f4faf5" letter-spacing="-0.6">mornings out.</text>
    <text x="34" y="190" font-size="9" fill="#93a89e">Layering that works, tested on real trails.</text>
    <rect x="34" y="206" width="100" height="27" rx="3" fill="url(#nv-green)"/>
    <text x="84" y="223" font-size="7.5" fill="#0f1a17" text-anchor="middle" letter-spacing="1.2" font-weight="bold">SHOP JACKETS</text>
  </g>

