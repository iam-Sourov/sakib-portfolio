<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Nordvik outdoor gear store preview">
  <defs>
    <linearGradient id="nv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#1b2a25"/>
    </linearGradient>
    <linearGradient id="nv-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd694"/>
      <stop offset="1" stop-color="#5fbe7f"/>
