      <text x="392" y="37">WOMEN</text>
      <text x="446" y="37">PACKS</text>
      <text x="490" y="37">SALE</text>
    </g>
    <g fill="none" stroke="#93a89e" stroke-width="1.3">
      <circle cx="546" cy="32" r="6"/><path d="M551 37l3 3"/>
      <path d="M568 26h12l3 13h-18z"/>
