  <g>
    <g>
      <rect x="356" y="86" width="118" height="148" rx="6" fill="#16221e" stroke="#2b3f37"/>
      <rect x="372" y="104" width="86" height="76" rx="4" fill="#243329"/>
      <path d="M394 128h42l8 36h-58z" fill="#3d5a48"/>
      <path d="M404 128v-8h22v8" stroke="#8fd694" stroke-width="2" fill="none"/>
      <rect x="366" y="188" width="12" height="20" fill="#33513f" rx="2"/>
