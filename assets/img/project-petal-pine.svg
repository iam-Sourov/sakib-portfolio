<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Petal and Pine florist website preview">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf5f3"/>
      <stop offset="1" stop-color="#f6e4e0"/>
    </linearGradient>
    <linearGradient id="pp-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c96a72"/>
      <stop offset="1" stop-color="#a84855"/>
    </linearGradient>
    <linearGradient id="pp-sage" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6d8a72"/>
      <stop offset="1" stop-color="#9bb79d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#pp-bg)"/>
  <circle cx="586" cy="330" r="120" fill="#f3ded8" opacity="0.7"/>
  <circle cx="56" cy="52" r="70" fill="#faeae6" opacity="0.9"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="34" y="42" font-size="15" fill="#4a3330" letter-spacing="2.4">PETAL &amp; PINE</text>
    <g font-family="Helvetica, Arial, sans-serif" fill="#8a6f6a" font-size="7.5" letter-spacing="1.4">
      <text x="366" y="40">BOUQUETS</text>
      <text x="440" y="40">OCCASIONS</text>
      <text x="514" y="40">DELIVERY</text>
    </g>
    <g fill="none" stroke="#a88b85" stroke-width="1.2">
      <circle cx="600" cy="34" r="6"/><path d="M605 39l3 3"/>
    </g>

    <text x="34" y="112" font-size="7" font-family="Helvetica, Arial, sans-serif" fill="#b4696f" letter-spacing="3">SAME-DAY DELIVERY</text>
    <text x="34" y="156" font-size="34" fill="#43302e" letter-spacing="-0.4">Flowers that</text>
    <text x="34" y="194" font-size="34" fill="#43302e" letter-spacing="-0.4">say it softly.</text>
    <text x="34" y="220" font-size="9" font-family="Helvetica, Arial, sans-serif" fill="#8a6f6a">Hand-tied seasonal bouquets, arranged the morning they arrive.</text>
    <rect x="34" y="238" width="104" height="28" rx="14" fill="url(#pp-rose)"/>
    <text x="86" y="256" font-size="8" font-family="Helvetica, Arial, sans-serif" fill="#fff6f4" text-anchor="middle" letter-spacing="1.4">SHOP FLOWERS</text>
  </g>

  <!-- bouquet illustration -->
  <g transform="translate(360 108)">
    <path d="M86 128c-30 0-52-16-52-38 0-16 12-26 26-26 6 0 12 2 16 6-2-18 8-30 22-30s24 12 22 30c4-4 10-6 16-6 14 0 26 10 26 26 0 22-22 38-52 38Z" fill="#f0d3cd"/>
    <g fill="none" stroke="#7d9a80" stroke-width="1.8">
      <path d="M86 128v56M66 128c-10 14-14 34-12 56M106 128c10 14 14 34 12 56"/>
    </g>
    <g fill="url(#pp-rose)">
      <circle cx="60" cy="76" r="17"/>
      <circle cx="112" cy="70" r="15"/>
      <circle cx="86" cy="52" r="14"/>
      <circle cx="86" cy="94" r="16"/>
    </g>
    <g fill="#f7e6e2" opacity="0.9">
      <circle cx="60" cy="76" r="7"/>
      <circle cx="112" cy="70" r="6"/>
      <circle cx="86" cy="52" r="5.5"/>
      <circle cx="86" cy="94" r="6.5"/>
    </g>
    <g stroke="#4a3330" stroke-width="1" opacity="0.35" fill="none">
      <path d="M28 148c0 10 8 18 18 18h80c10 0 18-8 18-18"/>
    </g>
  </g>

  <!-- collection row -->
  <g>
    <g font-family="Helvetica, Arial, sans-serif">
      <rect x="34" y="292" width="126" height="76" rx="6" fill="#fbeae7"/>
      <circle cx="66" cy="322" r="12" fill="url(#pp-rose)"/>
      <path d="M66 334v18" stroke="#7d9a80" stroke-width="1.6"/>
      <text x="90" y="326" font-size="7.5" fill="#6d5350" letter-spacing="0.8">Just because</text>
      <text x="90" y="340" font-size="7" fill="#a08680">from $32</text>

      <rect x="176" y="292" width="126" height="76" rx="6" fill="#f7f0e6"/>
      <circle cx="208" cy="322" r="12" fill="#e0b878"/>
      <path d="M208 334v18" stroke="#7d9a80" stroke-width="1.6"/>
      <text x="232" y="326" font-size="7.5" fill="#6d5350" letter-spacing="0.8">Birthday</text>
      <text x="232" y="340" font-size="7" fill="#a08680">from $38</text>

      <rect x="318" y="292" width="126" height="76" rx="6" fill="#eef3ec"/>
      <circle cx="350" cy="322" r="12" fill="url(#pp-sage)"/>
      <path d="M350 334v18" stroke="#7d9a80" stroke-width="1.6"/>
      <text x="374" y="326" font-size="7.5" fill="#4e5f51" letter-spacing="0.8">Sympathy</text>
      <text x="374" y="340" font-size="7" fill="#8a9b8c">from $44</text>
    </g>
  </g>
</svg>
