<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Craftline Studio SEO audit preview">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f3f0"/>
      <stop offset="1" stop-color="#e6e4de"/>
    </linearGradient>
    <linearGradient id="cl-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8613c"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#cl-bg)"/>
  <rect x="0" y="0" width="640" height="56" fill="#22211f"/>
  <circle cx="600" cy="330" r="110" fill="#e8e2d6" opacity="0.6"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="34" y="35" font-size="11" font-weight="bold" fill="#f7f6f3" letter-spacing="2">CRAFTLINE STUDIO</text>
    <text x="404" y="35" font-size="7.5" fill="#9d9a93" letter-spacing="1.6">SEO AUDIT</text>
    <rect x="524" y="23" width="82" height="20" rx="3" fill="#e8613c"/>
    <text x="565" y="36" font-size="7" fill="#fff5f1" text-anchor="middle" letter-spacing="1">Q4 REVIEW</text>

    <text x="34" y="92" font-size="22" font-weight="bold" fill="#22211f" letter-spacing="-0.4">Technical audit, item by item</text>
    <text x="34" y="112" font-size="8.5" fill="#7b766c">Crawl cleanup, indexation fixes and internal linking.</text>
  </g>

  <!-- score ring -->
  <g>
    <circle cx="98" cy="196" r="46" fill="none" stroke="#dad6cc" stroke-width="9"/>
    <circle cx="98" cy="196" r="46" fill="none" stroke="url(#cl-orange)" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="212 289" transform="rotate(-90 98 196)"/>
    <text x="98" y="194" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#22211f" text-anchor="middle">73</text>
    <text x="98" y="210" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#7b766c" text-anchor="middle" letter-spacing="1.4">HEALTH</text>
  </g>

  <!-- issues list -->
  <g>
    <rect x="170" y="138" width="256" height="182" rx="6" fill="#fbfaf8" stroke="#dcd8cf"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#4a463f">
      <text x="186" y="158" font-size="7" fill="#9a958b" letter-spacing="1.4">PRIORITY ISSUES</text>

      <circle cx="188" cy="176" r="3.5" fill="#e8613c"/>
      <text x="200" y="179">Duplicate title tags across 14 pages</text>
      <path d="M186 190h224" stroke="#eeebe4"/>

      <circle cx="188" cy="204" r="3.5" fill="#e8613c"/>
      <text x="200" y="207">Missing meta descriptions on blog</text>
      <path d="M186 218h224" stroke="#eeebe4"/>

      <circle cx="188" cy="232" r="3.5" fill="#f08a3c"/>
      <text x="200" y="235">Thin content on service templates</text>
      <path d="M186 246h224" stroke="#eeebe4"/>

      <circle cx="188" cy="260" r="3.5" fill="#f08a3c"/>
      <text x="200" y="263">Slow image payload on mobile</text>
      <path d="M186 274h224" stroke="#eeebe4"/>

      <circle cx="188" cy="288" r="3.5" fill="#7a7670"/>
      <text x="200" y="291">Orphan pages needing internal links</text>
    </g>
  </g>

  <!-- crawl bars -->
  <g>
    <rect x="442" y="138" width="164" height="182" rx="6" fill="#22211f"/>
    <text x="458" y="158" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#9d9a93" letter-spacing="1.4">PAGES INDEXED</text>
    <g>
      <rect x="458" y="176" width="132" height="8" rx="4" fill="#33322f"/>
      <rect x="458" y="176" width="112" height="8" rx="4" fill="url(#cl-orange)"/>
      <rect x="458" y="200" width="132" height="8" rx="4" fill="#33322f"/>
      <rect x="458" y="200" width="88" height="8" rx="4" fill="#f08a3c"/>
      <rect x="458" y="224" width="132" height="8" rx="4" fill="#33322f"/>
      <rect x="458" y="224" width="128" height="8" rx="4" fill="#f0b03c"/>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#9d9a93">
      <text x="458" y="254">Before</text>
      <text x="458" y="278">After fix</text>
      <text x="458" y="302">Target</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#8f8a80" letter-spacing="1.4">
    <text x="34" y="352">CRAWL</text>
    <text x="96" y="352">INDEX</text>
    <text x="158" y="352">METADATA</text>
    <text x="240" y="352">LINKS</text>
    <text x="300" y="352">SPEED</text>
    <rect x="34" y="362" width="572" height="1" fill="#d8d4ca"/>
  </g>
</svg>
