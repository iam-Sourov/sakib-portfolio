<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Glowtide Skincare website concept preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe6"/>
      <stop offset="1" stop-color="#e7d9c9"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f6f1"/>
      <stop offset="1" stop-color="#d9c9b6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5d4b"/>
      <stop offset="1" stop-color="#7fa98c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <circle cx="654" cy="96" r="150" fill="#dccbb6" opacity="0.55"/>
  <circle cx="120" cy="470" r="110" fill="#cfdccf" opacity="0.45"/>

  <!-- nav -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="52" y="56" font-size="17" letter-spacing="3" fill="#2f2a25" font-weight="bold">GLOWTIDE</text>
    <g fill="#6b625a" font-size="11" letter-spacing="1.4">
      <text x="480" y="55">SHOP</text>
      <text x="548" y="55">ROUTINE</text>
      <text x="634" y="55">ABOUT</text>
    </g>
    <circle cx="742" cy="51" r="13" fill="none" stroke="#8f8478" stroke-width="1.2"/>
    <text x="738" y="56" font-size="11" fill="#6b625a">2</text>
  </g>

  <!-- product bottles -->
  <g>
    <rect x="392" y="196" width="86" height="188" rx="14" fill="url(#bottle)"/>
    <rect x="408" y="168" width="54" height="34" rx="7" fill="#c9b8a4"/>
    <rect x="408" y="266" width="54" height="52" rx="3" fill="#f4efe7"/>
    <text x="435" y="290" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#3d362f" text-anchor="middle" letter-spacing="1">GLOW</text>
    <text x="435" y="304" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#7d7367" text-anchor="middle" letter-spacing="0.8">SERUM</text>

    <rect x="500" y="238" width="70" height="146" rx="12" fill="#e8dccb"/>
    <rect x="514" y="214" width="42" height="28" rx="6" fill="#bda98f"/>
    <rect x="514" y="296" width="42" height="40" rx="3" fill="#f7f2ea"/>

    <ellipse cx="435" cy="392" rx="120" ry="16" fill="#c9b7a2" opacity="0.5"/>
  </g>

  <!-- headline -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="52" y="182" font-size="44" fill="#26211c" font-weight="bold" letter-spacing="-1">Skin that</text>
    <text x="52" y="228" font-size="44" fill="#26211c" font-weight="bold" letter-spacing="-1">feels like</text>
    <text x="52" y="274" font-size="44" fill="#3f6a55" font-weight="bold" letter-spacing="-1">ritual.</text>
    <text x="52" y="308" font-size="12" fill="#7b7166" letter-spacing="0.4">Clean, botanical skincare for everyday calm.</text>
    <rect x="52" y="332" width="132" height="38" rx="19" fill="#2f5d4b"/>
    <text x="118" y="356" font-size="11" fill="#f7f4ef" text-anchor="middle" letter-spacing="1.6">SHOP NOW</text>
  </g>

  <!-- decorative leaf -->
  <path d="M700 330c40-14 62-48 62-48s-40 2-58 22-4 26-4 26Z" fill="url(#leaf)" opacity="0.85"/>
  <path d="M730 344c-6-26-26-40-26-40" stroke="#2f5d4b" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
