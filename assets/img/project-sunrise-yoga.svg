<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Sunrise Yoga Studio website preview">
  <defs>
    <linearGradient id="sy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2036"/>
      <stop offset="1" stop-color="#3b2b45"/>
    </linearGradient>
    <linearGradient id="sy-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c98a"/>
      <stop offset="1" stop-color="#e8a06a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sy-bg)"/>
  <g opacity="0.5">
    <circle cx="560" cy="120" r="132" fill="#e8a06a" opacity="0.12"/>
    <circle cx="560" cy="120" r="88" fill="#f6c98a" opacity="0.1"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <circle cx="44" cy="33" r="8" fill="url(#sy-sun)" opacity="0.85"/>
    <text x="62" y="38" font-size="11" font-weight="bold" fill="#f7ecdf" letter-spacing="2">SUNRISE YOGA</text>
    <g fill="#b7a6b8" font-size="7.5" letter-spacing="1.4">
      <text x="374" y="37">CLASSES</text>
      <text x="434" y="37">TEACHERS</text>
      <text x="500" y="37">PRICING</text>
    </g>
    <rect x="552" y="24" width="54" height="21" rx="10.5" fill="#f6c98a"/>
    <text x="579" y="38" font-size="7" fill="#2a2036" text-anchor="middle" letter-spacing="0.6">BOOK</text>

    <text x="34" y="104" font-size="7" fill="#e8a06a" letter-spacing="3">NEW STUDENT OFFER</text>
    <text x="34" y="146" font-size="30" font-weight="bold" fill="#fdf6ee" letter-spacing="-0.8">Begin where</text>
    <text x="34" y="180" font-size="30" font-weight="bold" fill="#fdf6ee" letter-spacing="-0.8">you are.</text>
    <text x="34" y="206" font-size="9" fill="#b7a6b8">Small classes, unhurried teaching and a first week on us.</text>
    <rect x="34" y="222" width="104" height="28" rx="14" fill="url(#sy-sun)"/>
    <text x="86" y="240" font-size="7.5" fill="#2a2036" text-anchor="middle" letter-spacing="1.2" font-weight="bold">VIEW TIMETABLE</text>
    <text x="150" y="240" font-size="7.5" fill="#b7a6b8" letter-spacing="0.4">No experience needed</text>
  </g>

  <!-- timetable -->
  <g>
    <rect x="330" y="86" width="276" height="184" rx="10" fill="#241b2e" stroke="#4a3a58"/>
    <text x="350" y="110" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#b7a6b8" letter-spacing="1.6">THIS WEEK</text>
    <g font-family="Helvetica, Arial, sans-serif">
      <g font-size="7" fill="#8f7f96">
        <text x="350" y="134">MON</text><text x="392" y="134">TUE</text><text x="434" y="134">WED</text><text x="476" y="134">THU</text><text x="518" y="134">FRI</text>
      </g>
      <g stroke="#3a2c47" stroke-width="1">
        <path d="M350 142h236M350 176h236M350 210h236"/>
      </g>
      <g font-size="6.5" fill="#fdf6ee">
        <rect x="350" y="150" width="36" height="18" rx="4" fill="#e8a06a" opacity="0.85"/>
        <text x="368" y="162" text-anchor="middle" fill="#2a2036">Flow</text>
        <rect x="434" y="150" width="36" height="18" rx="4" fill="#6f5a80"/>
        <text x="452" y="162" text-anchor="middle">Hatha</text>
        <rect x="518" y="184" width="36" height="18" rx="4" fill="#6f5a80"/>
        <text x="536" y="196" text-anchor="middle">Yin</text>
        <rect x="392" y="184" width="36" height="18" rx="4" fill="#8c6f5a"/>
        <text x="410" y="196" text-anchor="middle">Restore</text>
        <rect x="350" y="218" width="36" height="18" rx="4" fill="#6f5a80"/>
        <text x="368" y="230" text-anchor="middle">Core</text>
        <rect x="476" y="218" width="36" height="18" rx="4" fill="#e8a06a" opacity="0.7"/>
        <text x="494" y="230" text-anchor="middle" fill="#2a2036">Flow</text>
      </g>
      <text x="350" y="258" font-size="7" fill="#8f7f96">Studio B · 60 min · mats provided</text>
    </g>
  </g>

  <!-- teacher chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#d8c9d8">
    <g>
      <circle cx="46" cy="304" r="16" fill="#4a3a58"/>
      <circle cx="46" cy="299" r="6" fill="#c9b0a8"/>
      <path d="M36 316c2-8 8-11 10-11s8 3 10 11" fill="#c9b0a8"/>
      <text x="70" y="302">Maya — Hatha</text>
      <text x="70" y="314" font-size="6.5" fill="#8f7f96">12 years teaching</text>
    </g>
    <g>
      <circle cx="176" cy="304" r="16" fill="#4a3a58"/>
      <circle cx="176" cy="299" r="6" fill="#d8b6a0"/>
      <path d="M166 316c2-8 8-11 10-11s8 3 10 11" fill="#d8b6a0"/>
      <text x="200" y="302">Rafi — Vinyasa</text>
      <text x="200" y="314" font-size="6.5" fill="#8f7f96">Studio founder</text>
    </g>
    <rect x="34" y="344" width="572" height="1" fill="#4a3a58" opacity="0.6"/>
    <text x="34" y="366" font-size="7" fill="#8f7f96" letter-spacing="1.6">DROP-IN · 10-CLASS · MONTHLY UNLIMITED</text>
  </g>
