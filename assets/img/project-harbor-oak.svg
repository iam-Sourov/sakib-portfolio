<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Harbor and Oak furniture store preview">
  <defs>
    <linearGradient id="ho-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#e8e0d3"/>
    </linearGradient>
    <linearGradient id="ho-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8895c"/>
      <stop offset="1" stop-color="#946b43"/>
    </linearGradient>
    <linearGradient id="ho-olive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46543c"/>
      <stop offset="1" stop-color="#5c6d4d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ho-bg)"/>
  <rect x="0" y="0" width="640" height="58" fill="#fbf8f3" opacity="0.85"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="34" y="36" font-size="12" font-weight="bold" fill="#2f2a23" letter-spacing="2.2">HARBOR &amp; OAK</text>
    <g fill="#7a6f60" font-size="8" letter-spacing="1.2">
      <text x="300" y="35">SHOP</text>
      <text x="344" y="35">ROOMS</text>
      <text x="398" y="35">JOURNAL</text>
    </g>
    <g fill="none" stroke="#9c8f7d" stroke-width="1.3">
      <circle cx="530" cy="31" r="7"/><path d="M535 36l4 4"/>
      <path d="M560 24h12l4 14h-20z"/>
    </g>
    <circle cx="572" cy="24" r="4.5" fill="#46543c"/>
    <text x="570.5" y="27" font-size="5.5" fill="#f7f3ec" text-anchor="middle">2</text>

    <text x="34" y="106" font-size="7.5" fill="#8a7d6b" letter-spacing="2.6">NEW SEASON</text>
    <text x="34" y="142" font-size="28" font-weight="bold" fill="#2f2a23" letter-spacing="-0.7">Made for the</text>
    <text x="34" y="174" font-size="28" font-weight="bold" fill="#46543c" letter-spacing="-0.7">everyday room.</text>
    <text x="34" y="198" font-size="9" fill="#7a6f60">Solid timber furniture, built to be lived with for years.</text>

    <rect x="34" y="216" width="96" height="26" rx="2" fill="url(#ho-olive)"/>
    <text x="82" y="233" font-size="7.5" fill="#f7f3ec" text-anchor="middle" letter-spacing="1.2">SHOP ALL</text>
    <text x="146" y="233" font-size="8" fill="#5b5348" letter-spacing="0.6">Free delivery over $150</text>
  </g>

  <!-- product cards -->
  <g>
    <g>
      <rect x="380" y="96" width="112" height="118" rx="4" fill="#fbf8f3" stroke="#e2d8c8"/>
      <rect x="398" y="126" width="76" height="46" rx="3" fill="url(#ho-wood)"/>
      <rect x="392" y="172" width="8" height="22" rx="2" fill="#8a6242"/>
      <rect x="472" y="172" width="8" height="22" rx="2" fill="#8a6242"/>
      <text x="394" y="204" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#6f6355">Alder Lounge Chair</text>
    </g>
    <g>
      <rect x="504" y="96" width="102" height="118" rx="4" fill="#fbf8f3" stroke="#e2d8c8"/>
      <rect x="520" y="132" width="70" height="14" rx="3" fill="url(#ho-wood)"/>
      <rect x="526" y="146" width="6" height="34" fill="#8a6242"/>
      <rect x="578" y="146" width="6" height="34" fill="#8a6242"/>
      <rect x="528" y="154" width="54" height="4" fill="#a67a51"/>
      <text x="518" y="204" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#6f6355">Oak Dining Table</text>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="380" y="232" width="226" height="34" rx="4" fill="#46543c"/>
    <text x="493" y="253" font-size="8.5" fill="#f7f3ec" text-anchor="middle" letter-spacing="1.4">EXPLORE THE COLLECTION</text>

    <g>
      <rect x="34" y="276" width="126" height="84" rx="4" fill="#efe7da"/>
      <rect x="176" y="276" width="126" height="84" rx="4" fill="#e7efe6"/>
      <rect x="318" y="276" width="126" height="84" rx="4" fill="#efe4dc"/>
      <text x="46" y="348" font-size="8" fill="#6f6355" letter-spacing="0.8">Living room</text>
      <text x="188" y="348" font-size="8" fill="#556350" letter-spacing="0.8">Bedroom</text>
      <text x="330" y="348" font-size="8" fill="#7a6558" letter-spacing="0.8">Workspace</text>
    </g>
  </g>
</svg>
